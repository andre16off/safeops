
spring.application.name=safeops-api

# Valores secretos (clave JWT y contraseñas iniciales): se leen de
# application-local.properties, que no se sube al repositorio, o de las
# variables de entorno JWT_SECRET, SAFEOPS_ADMIN_PASSWORD y SAFEOPS_INVITADO_PASSWORD.
# Ver application-local.properties.example.
spring.config.import=optional:file:./application-local.properties

# Base de datos H2 persistente en archivo
spring.datasource.url=jdbc:h2:file:./data/safeopsdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración de JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

jwt.expiration=3600000
