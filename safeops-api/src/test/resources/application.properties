# Configuración solo para las pruebas automatizadas.
# Usa una base H2 en memoria para no tocar los datos de ./data/safeopsdb.
spring.application.name=safeops-api

spring.datasource.url=jdbc:h2:mem:safeopstest;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Valores de prueba: no se usan fuera de las pruebas.
jwt.secret=clave-solo-para-pruebas-automatizadas-safeops-0000
jwt.expiration=3600000
safeops.admin.password=admin-de-prueba
safeops.invitado.password=invitado-de-prueba
